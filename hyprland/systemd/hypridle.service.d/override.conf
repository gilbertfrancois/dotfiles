[Unit]
# The packaged unit only gates on WAYLAND_DISPLAY, but GNOME's Wayland
# session also reaches graphical-session.target with WAYLAND_DISPLAY set,
# so hypridle starts (and errors) there too. Reset the condition list and
# gate on the compositor instead.
ConditionEnvironment=
ConditionEnvironment=XDG_CURRENT_DESKTOP=Hyprland
