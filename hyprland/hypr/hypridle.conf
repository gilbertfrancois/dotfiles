# hypridle: locks the session before any suspend (lid close, power button,
# idle timeout, or a manual `systemctl suspend`), regardless of what
# triggered it, and suspends the machine on idle (see listeners below).
general {
    lock_cmd = noctalia msg session lock
    before_sleep_cmd = noctalia msg session lock
    # eDP-1 is deliberately skipped here -- modules/lid.lua's "switch:off:Lid
    # Switch" handler is the sole authority over it (see comments there) and
    # re-enables it with the correct mode/scale. Having this run wlr-randr
    # --on against eDP-1 at the same time raced with that handler on every
    # lid-open-triggered resume, which was one contributor to garbled/wrong
    # output state right after waking.
    #
    # Lid opened to wake the machine: libinput re-creates the Lid Switch
    # device on resume, so no switch:off event reaches modules/lid.lua and
    # eDP-1 stayed off. If the ACPI lid is open, reload the Hyprland config
    # instead: that re-applies the static monitor rules (eDP-1 on, correct
    # mode/scale) and lid.lua's reload block keeps it off if the lid is closed.
    after_sleep_cmd = sh -c 'for o in $(wlr-randr | grep "^[A-Za-z]" | cut -d" " -f1); do [ "$o" = "eDP-1" ] && continue; wlr-randr --output "$o" --on; done; sleep 1; grep -qs open /proc/acpi/button/lid/*/state && hyprctl reload'
}

# Suspend on idle: after 5 min on battery, after 15 min on AC (e.g. docked
# with the lid closed). hypridle has no built-in AC/battery distinction, so
# the 5 min listener checks /sys/class/power_supply/AC/online itself and
# no-ops on AC. It is evaluated once, when the timeout fires, not
# continuously. The 15 min listener suspends unconditionally (on battery the
# 5 min one has already fired). general{}'s before_sleep_cmd (session lock)
# fires for these suspends like for any other, since it hooks logind's
# PrepareForSleep. On wake, after_sleep_cmd re-enables the external outputs
# and modules/lid.lua decides about eDP-1 (lid open -> on, closed -> off).
listener {
    timeout = 300
    on-timeout = sh -c '[ "$(cat /sys/class/power_supply/AC/online 2>/dev/null)" = "0" ] && systemctl suspend'
}

listener {
    timeout = 900
    on-timeout = systemctl suspend
}
