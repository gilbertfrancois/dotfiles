# hypridle: only used here to lock the session before any suspend
# (lid close, power button, or a manual `systemctl suspend`), regardless
# of what triggered it. No real idle-timeout behavior is configured.
general {
    lock_cmd = noctalia msg session lock
    before_sleep_cmd = noctalia msg session lock
    # eDP-1 is deliberately skipped here -- modules/lid.lua's "switch:off:Lid
    # Switch" handler is the sole authority over it (see comments there) and
    # re-enables it with the correct mode/scale. Having this run wlr-randr
    # --on against eDP-1 at the same time raced with that handler on every
    # lid-open-triggered resume, which was one contributor to garbled/wrong
    # output state right after waking.
    after_sleep_cmd = sh -c 'for o in $(wlr-randr | grep "^[A-Za-z]" | cut -d" " -f1); do [ "$o" = "eDP-1" ] && continue; wlr-randr --output "$o" --on; done'
}

# Suspend after 5 min idle, but only on battery -- hypridle has no built-in
# AC/battery distinction, so the on-timeout command checks
# /sys/class/power_supply/AC/online itself and no-ops on AC. This is
# evaluated once, when the timeout actually fires, not continuously -- if
# you unplug partway through an idle period on AC, it won't suspend until a
# fresh 5-minute idle period elapses after that. general{}'s
# before_sleep_cmd (session lock) still fires for this suspend same as any
# other, since it hooks logind's PrepareForSleep regardless of what
# triggered it.
listener {
    timeout = 300
    on-timeout = sh -c '[ "$(cat /sys/class/power_supply/AC/online 2>/dev/null)" = "0" ] && systemctl suspend'
}
